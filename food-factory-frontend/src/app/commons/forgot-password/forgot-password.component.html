<app-header></app-header>

<div class="row customGridDiv">
    <!-- Left Section -->
    <div class="p-col-12 p-md-6 left-section">
        <div class="image-container">
            <img src="assets/images/Forgot Password.avif" alt="Form Image" style="max-width: 100%;" *ngIf="step === 1" />
            <img src="assets/images/OTP.avif" alt="Form Image" style="max-width: 100%;" *ngIf="step === 2" />
            <img src="assets/images/Password.avif" alt="Form Image" style="max-width: 100%;" *ngIf="step === 3" />
        </div>
    </div>

    <!-- Vertical Divider for Large Screens -->
    <div class="verticle-line"></div>

    <!-- Right Section -->
    <div class="p-col-12 p-md-6 right-section">
        <!-- Step 1: Enter Email for OTP -->
        <form *ngIf="step === 1" (ngSubmit)="sendOTP()" class="form-container space-y-5">
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" pInputText [(ngModel)]="email" name="email" required class="form-input"
                  placeholder="Enter your email" #emailField="ngModel" />
            
                <!-- Email validation messages -->
                <small class="text-error" *ngIf="emailField.touched && emailField.errors?.['required']">
                  Email is required.
                </small>
                <small class="text-error" *ngIf="emailField.touched && isInvalidEmail">
                  Email must contain "&#64;".
                </small>
            </div>
            <div class="form-button-div">
                <button pButton type="submit" label="Send OTP" icon="pi pi-envelope"
                    class="form-submit-button loginpass" [disabled]="!email">
                </button>
            </div>
        </form>

        <!-- Step 2: Verify OTP -->
        <form *ngIf="step === 2" (ngSubmit)="verifyOTP()" class="form-container space-y-5">
            <div class="form-group">
                <label class="form-label">Enter OTP</label>
                <p-inputMask mask="999999" [(ngModel)]="otp" name="otp" class="form-input"
                    placeholder="Enter OTP sent to your email" [pattern]="'^[0-9]{6}$'" #otpField="ngModel" />
                <small class="text-error" *ngIf="otpField.touched && otpField.errors?.['required']">
                    OTP is required.
                </small>
                <small class="text-error" *ngIf="otpField.touched && isInvalidOtp">
                    OTP must be a 6-digit number and contain only digits.
                </small>
            </div>
            
            <div class="form-button-div">
                <button pButton type="submit" label="Verify OTP" icon="pi pi-check" class="form-submit-button loginpass"
                    [disabled]="!otp">
                </button>
            </div>
        </form>

        <!-- Step 3: Reset Password -->
        <form *ngIf="step === 3" (ngSubmit)="resetPassword()" class="form-container space-y-5">
            <div class="form-group">
                <label class="form-label">Password</label>
                <p-password [(ngModel)]="password" name="password" required [toggleMask]="true" class="form-password-input"
                  placeholder="Enter Password" #passwordField="ngModel" />
            
                <!-- Password validation message -->
                <small class="text-error" *ngIf="passwordField.touched && passwordField.errors?.['required']">
                  Password is required.
                </small>
                <small class="text-error" *ngIf="passwordField.touched && isInvalidPassword">
                  Password must be at least 8 characters long, contain 1 uppercase letter, 1 number, and 1 special character.
                </small>
            </div>

            <div class="form-group">
                <label class="form-label">Confirm Password</label>
                <p-password [(ngModel)]="confirmPassword" name="confirmPassword" required [toggleMask]="true"
                    class="form-password-input confirmPass" placeholder="Confirm Password"
                    #confirmPasswordField="ngModel" />
                <span *ngIf="password && confirmPassword && password !== confirmPassword" class="pass-not-match-text">
                    Passwords do not match!
                </span>
            </div>
            <div class="form-button-div">
                <button pButton type="submit" label="Reset Password" icon="pi pi-lock"
                    class="form-submit-button loginpass" [disabled]="!password">
                </button>
            </div>
        </form>
    </div>
</div>

<div *ngIf="isLoading" class="full-screen-loader">
    <app-wave-loader></app-wave-loader>
</div>

<div class="card flex justify-content-center">
    <p-toast />
</div>

<app-loader></app-loader>

<app-footer></app-footer>
