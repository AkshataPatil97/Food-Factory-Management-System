<div class="report-container">
    <h2>Generate Reports</h2>
  
    <div class="report-filters">
      <div class="p-grid">
        <div class="p-col-12 p-md-4">
          <label>Start Date:</label>
          <p-calendar [(ngModel)]="reportFilters.startDate" dateFormat="yy-mm-dd"></p-calendar>
        </div>
        <div class="p-col-12 p-md-4">
          <label>End Date:</label>
          <p-calendar [(ngModel)]="reportFilters.endDate" dateFormat="yy-mm-dd"></p-calendar>
        </div>
        <div class="p-col-12 p-md-4">
          <label>Entity:</label>
          <p-dropdown [(ngModel)]="reportFilters.entityType" [options]="entityOptions" placeholder="Select Entity" (onChange)="onEntityChange($event)"></p-dropdown>
        </div>
      </div>
      <!-- <div class="p-grid">
        <div class="p-col-12 text-right">
          <button pButton label="Generate PDF Report" class="p-button-primary" (click)="generateReport()"></button>
        </div>
      </div> -->
    </div>
  
    <div class="report-table" *ngIf="reportData.length > 0">
      <p-card header="Report Preview">
        <p-table [value]="reportData" [paginator]="true" [rows]="5">
          <ng-template pTemplate="header">
            <tr>
              <th *ngFor="let col of reportColumns">{{ col.header }}</th>
            </tr>
          </ng-template>
          <ng-template pTemplate="body" let-row>
            <tr>
              <td *ngFor="let col of reportColumns">{{ row[col.field] }}</td>
            </tr>
          </ng-template>
        </p-table>
      </p-card>
    </div>
  
    <div *ngIf="reportData.length === 0" class="text-center p-3">
      No data available for the selected criteria.
    </div>
  </div>
